<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2000 1000" preserveAspectRatio="none">
  <defs>
    <linearGradient id="pale" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#edf7fd"/>
      <stop offset="1" stop-color="#cbddeb"/>
    </linearGradient>
    <linearGradient id="navy" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#063b77"/>
      <stop offset="1" stop-color="#092956"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#ffc31f"/>
      <stop offset="1" stop-color="#f2b311"/>
